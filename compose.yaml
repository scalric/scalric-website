name: scalric

services:
  db:
    image: postgres:17-alpine
    container_name: scalric-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scalric
      POSTGRES_USER: scalric
      POSTGRES_PASSWORD: scalric_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scalric-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalric -d scalric"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scalric-postgres-data:
    name: scalric-postgres-data

networks:
  default:
    name: scalric-network
